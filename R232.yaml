memory_space: 0xFFF
max_number: 0xFF
width_data: 8
word_order: 'little-endian'

register_file:
  x0: &zero
    index: 0
    width: 8
    asset: R
  x1:
    index: 1
    width: 8
    asset: R/W
  x2:
    index: 2
    width: 8
    asset: R/W
  x3:
    index: 3
    width: 8
    asset: R/W
  x4:
    index: 4
    width: 8
    asset: R/W
  eq:
    index: 5
    width: 8
    asset: R/W
  ap:
    index: 6
    width: 8
    asset: R/W
  gp:
    index: 7
    width: 3
    asset: R/W
  tgp:
    index: 8
    width: 3
    asset: R/W
  pc:
    index: 9
    width: 8
    asset: R
  pc1:
    index: 10
    width: 3
    asset: R
  zero: {<<: *zero}

instruction_mapping:
  dooble:
    len: 2
    opcode: &op
      mode: const
      offset: 24
      len: 4
    Rd: &Rd
      mode: register
      offset: 28
      len: 4
    Rs1: &Rs1
      mode: register
      offset: 20
      len: 4
    Rs2: &Rs2
      mode: register
      offset: 24
      len: 4
  quad:
    len: 4
    lbl:
      mode: label
      offset: 4
      len: 11
    imm11:
      mode: imm
      offset: 4
      len: 11
    opcode: {<<: *op}
    Rd: {<<: *Rd}
    Rs1: {<<: *Rs1}
    Rs2: {<<: *Rs2}

coding:
  sb:
    type: dooble
    opcode: 1
    Rs1: arg0
  ml:
    type: dooble
    opcode: 2
    Rs1: arg0
  sbi:
    type: dooble
    opcode: 9
    Rs1: arg0
    imm11: arg1
